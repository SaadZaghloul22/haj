name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '3.47.9', cache: true }
      - name: Analyze and test
        run: |
          mkdir -p out
          flutter pub get
          set +e
          flutter analyze --no-fatal-infos > out/analyze.txt 2>&1; A=$?
          flutter test --reporter expanded > out/test.txt 2>&1; T=$?
          tail -40 out/analyze.txt; tail -30 out/test.txt
          echo "analyze=$A test=$T" > out/status.txt
          [ $A -eq 0 ] && [ $T -eq 0 ]
      - name: Build AAB and APK
        run: |
          flutter build appbundle --release > out/build.txt 2>&1 || (tail -80 out/build.txt; exit 1)
          flutter build apk --release >> out/build.txt 2>&1 || (tail -80 out/build.txt; exit 1)
          cp build/app/outputs/bundle/release/app-release.aab out/app-release-unsigned.aab
          keytool -genkeypair -keystore test.jks -storepass android -keypass android -alias test \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Hajj Test" >/dev/null 2>&1
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          $BT/apksigner sign --ks test.jks --ks-pass pass:android --out out/hajj-test.apk \
            build/app/outputs/flutter-apk/app-release.apk
          $BT/apksigner verify out/hajj-test.apk && ls -la out
      - name: Publish outputs
        if: always()
        run: |
          cd out && git init -q -b builds && git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "build ${GITHUB_SHA}"
          for i in 1 2 3 4; do git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" builds && break; sleep 10; done

  screenshots:
    # Private repos get runners without KVM, so screens are rendered by flutter test (offline app).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '3.47.9', cache: true }
      - name: Render screens
        run: |
          flutter pub get
          mkdir -p screenshots
          set +e
          flutter test test_shots/shots_test.dart --reporter expanded > screenshots/shots.txt 2>&1; S=$?
          tail -40 screenshots/shots.txt
          echo "shots=$S" > screenshots/status.txt
          exit $S
      - name: Publish screenshots
        if: always()
        run: |
          mkdir -p screenshots
          cd screenshots && git init -q -b screens && git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "screens ${GITHUB_SHA}" || exit 0
          for i in 1 2 3 4; do git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" screens && break; sleep 10; done
